name: 2DS Flat-Screen Game Builder

on:
  workflow_dispatch:
    inputs:
      target_format:
        description: 'Choose build output format'
        required: true
        default: '3dsx'
        type: choice
        options:
          - '3dsx'
          - 'cia'
          - 'all'
      app_title:
        description: 'Application Title'
        required: false
        default: '2DS Game'
        type: string
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build 2DS Binary
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: arm-none-eabi-gcc
      CXX: arm-none-eabi-g++
      LD: arm-none-eabi-gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools & Workspace
        run: |
          apt-get update && apt-get install -y unzip imagemagick zip || true
          mkdir -p workspace output_binaries
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d workspace
          else
            cp -r ./* workspace/ 2>/dev/null || true
          fi

      - name: Compile 2DS Binary
        run: |
          MAKE_DIR=$(find workspace -name "Makefile" -exec dirname {} \; | head -n 1)
          cd "$MAKE_DIR"
          make clean || true
          if [ ! -f "icon.png" ]; then
            convert -size 48x48 xc:#1E293B icon.png || touch icon.png
          fi
          smdhtool --create "${{ github.event.inputs.app_title || '2DS Game' }}" "2DS Flat Screen Edition" "Prism Ink" icon.png game.smdh || true
          make CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ LD=arm-none-eabi-gcc

          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          TARGET_BASE="${ELF_FILE%.elf}"
          if [ -z "$TARGET_BASE" ]; then
            TARGET_BASE="game_2ds"
          fi

          if [ -d "romfs" ]; then
            3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh --romfs=romfs
          else
            3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh
          fi
          cp *.3dsx ../../output_binaries/ 2>/dev/null || true

      - name: Upload 2DS Binary
        uses: actions/upload-artifact@v4
        with:
          name: 2ds_binaries
          path: output_binaries/*
