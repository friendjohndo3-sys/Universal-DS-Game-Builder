name: Universal 3DS Game Builder

on:
  workflow_dispatch:
    inputs:
      target_format:
        description: 'Choose build output format'
        required: true
        default: 'cia'
        type: choice
        options:
          - 'cia'
          - '3dsx'
          - 'all'
          - 'nds'
      app_title:
        description: 'Application Title'
        required: false
        default: 'Homebrew Game'
        type: string
      app_author:
        description: 'Author / Studio'
        required: false
        default: 'Prism Ink'
        type: string
      app_description:
        description: 'Short Description'
        required: false
        default: 'Custom Nintendo Homebrew'
        type: string
      product_code:
        description: 'Unique Product Code for CIA (format: CTR-P-XXXX)'
        required: false
        default: 'CTR-P-MEEP'
        type: string
      unique_id:
        description: 'Unique Hex ID for CIA (e.g. 0xF4100)'
        required: false
        default: '0xF4100'
        type: string
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Homebrew Package
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      CC: arm-none-eabi-gcc
      CXX: arm-none-eabi-g++
      LD: arm-none-eabi-gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools & Install CIA Tools
        run: |
          apt-get update && apt-get install -y unzip imagemagick zip curl wget || true
          mkdir -p "$GITHUB_WORKSPACE/workspace" "$GITHUB_WORKSPACE/output_binaries"

          echo "=== Installing makerom for CIA generation ==="
          curl -sSL "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip" -o /tmp/makerom.zip || true
          if [ -f /tmp/makerom.zip ]; then
            unzip -o /tmp/makerom.zip -d /tmp/makerom_bin 2>/dev/null || true
            if [ -f /tmp/makerom_bin/makerom ]; then
              cp /tmp/makerom_bin/makerom /usr/local/bin/makerom
              chmod +x /usr/local/bin/makerom
            elif [ -f /tmp/makerom_bin/ubuntu_x86_64/makerom ]; then
              cp /tmp/makerom_bin/ubuntu_x86_64/makerom /usr/local/bin/makerom
              chmod +x /usr/local/bin/makerom
            fi
          fi

          echo "=== Installing bannertool (optional) ==="
          curl -sSL "https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip" -o /tmp/bannertool.zip || true
          if unzip -t /tmp/bannertool.zip >/dev/null 2>&1; then
            unzip -o /tmp/bannertool.zip -d /tmp/bannertool_bin 2>/dev/null || true
            find /tmp/bannertool_bin -name "bannertool" -type f -exec cp {} /usr/local/bin/bannertool \; 2>/dev/null || true
            chmod +x /usr/local/bin/bannertool 2>/dev/null || true
          fi

          which makerom && echo "makerom is ready!" || echo "Warning: makerom not found"

          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting archive: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/workspace"
          else
            echo "No zip detected; copying repo files..."
            cp -r ./* "$GITHUB_WORKSPACE/workspace/" 2>/dev/null || true
          fi

      - name: Compile and Package Artifacts
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/output_binaries"
          mkdir -p "$OUT_DIR"

          MAKE_DIR=$(find "$GITHUB_WORKSPACE/workspace" -name "Makefile" -exec dirname {} \; | head -n 1)
          if [ -z "$MAKE_DIR" ]; then
            echo "Error: Could not locate a Makefile in the uploaded workspace!"
            exit 1
          fi
          cd "$MAKE_DIR"
          echo "Building in: $(pwd)"

          TARGET_FORMAT="${{ github.event.inputs.target_format || 'cia' }}"
          TITLE="${{ github.event.inputs.app_title || 'Homebrew Game' }}"
          AUTHOR="${{ github.event.inputs.app_author || 'Prism Ink' }}"
          DESC="${{ github.event.inputs.app_description || 'Custom Nintendo Homebrew' }}"
          PROD_CODE="${{ github.event.inputs.product_code || 'CTR-P-MEEP' }}"
          UNIQUE_ID="${{ github.event.inputs.unique_id || '0xF4100' }}"

          make clean || true

          if [ ! -f "icon.png" ]; then
            convert -size 48x48 xc:#34495E icon.png || touch icon.png
          fi

          # Generate SMDH descriptor for 3DS
          smdhtool --create "$TITLE" "$DESC" "$AUTHOR" icon.png game.smdh || true

          # Compile the codebase using ARM11 devkitARM
          make CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ LD=arm-none-eabi-gcc

          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          TARGET_BASE="${ELF_FILE%.elf}"
          if [ -z "$TARGET_BASE" ]; then
            TARGET_BASE="homebrew_app"
          fi

          # 1. Process CIA Target
          if [ "$TARGET_FORMAT" = "cia" ] || [ "$TARGET_FORMAT" = "all" ]; then
            echo "=== Building CIA Package ==="
            if which makerom >/dev/null 2>&1 && [ -n "$ELF_FILE" ]; then
              printf "BasicInfo:\n  Title                   : \"%s\"\n  CompanyCode             : \"00\"\n  ProductCode             : \"%s\"\n  ContentType             : Application\n  Logo                    : Nintendo\n\nTitleInfo:\n  UniqueId                : %s\n  Category                : Application\n\nCardInfo:\n  MediaType               : Card1\n\nOption:\n  UseOnSD                 : true\n  EnableCompress          : true\n  FreeProductCode         : true\n  EnableL2Cache           : true\n\nAccessControlInfo:\n  IdealProcessor          : 0\n  AffinityMask            : 1\n  Priority                : 16\n  CoreVersion             : 2\n  DescVersion             : 2\n  ReleaseKernelMajor      : \"02\"\n  ReleaseKernelMinor      : \"33\"\n  MemoryType              : Application\n  HandleTableSize         : 512\n  FileSystemAccess:\n    - DirectSdmc\n\nSystemControlInfo:\n  SaveDataSize            : 512KB\n  RemasterVersion         : 0\n  StackSize               : 0x40000\n" "$TITLE" "$PROD_CODE" "$UNIQUE_ID" > app.rsf

              BANNER_ARG=""
              if which bannertool >/dev/null 2>&1; then
                bannertool makebanner -i icon.png -a /dev/null -o banner.bin 2>/dev/null || true
                if [ -f "banner.bin" ]; then
                  BANNER_ARG="-banner banner.bin"
                fi
              fi

              ROMFS_ARG=""
              if [ -d "romfs" ]; then
                ROMFS_ARG="-romfs romfs"
              fi

              echo "Executing makerom..."
              makerom -f cia -o "${TARGET_BASE}.cia" -elf "$ELF_FILE" -rsf app.rsf -icon game.smdh $BANNER_ARG $ROMFS_ARG
              
              if [ -f "${TARGET_BASE}.cia" ]; then
                cp "${TARGET_BASE}.cia" "$OUT_DIR/"
                echo "Successfully built ${TARGET_BASE}.cia!"
              fi
            else
              echo "Error: makerom could not be found or ELF missing; unable to produce CIA."
              exit 1
            fi
          fi

          # 2. Process 3DSX Target (Only if requested or 'all')
          if [ "$TARGET_FORMAT" = "3dsx" ] || [ "$TARGET_FORMAT" = "all" ]; then
            echo "=== Packaging 3DSX Target ==="
            if ! ls *.3dsx 1> /dev/null 2>&1; then
              if [ -n "$ELF_FILE" ]; then
                if [ -d "romfs" ]; then
                  3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh --romfs=romfs || true
                else
                  3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh || true
                fi
              fi
            fi

            if ls *.3dsx 1> /dev/null 2>&1; then
              cp *.3dsx "$OUT_DIR/"
            fi
          fi

          # 3. Process NDS Target (Only if requested or 'all')
          if [ "$TARGET_FORMAT" = "nds" ] || [ "$TARGET_FORMAT" = "all" ]; then
            if ls *.nds 1> /dev/null 2>&1; then
              cp *.nds "$OUT_DIR/"
            fi
          fi

          echo "=== Final Output Binaries ==="
          ls -lh "$OUT_DIR/"

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_format || 'homebrew_binaries' }}
          path: output_binaries/*
