name: Universal 3DS Game Builder

on:
  workflow_dispatch:
    inputs:
      target_format:
        description: 'Choose build output format'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '3dsx'
          - 'cia'
          - 'nds'
      app_title:
        description: 'Application Title'
        required: false
        default: 'Homebrew Game'
        type: string
      app_author:
        description: 'Author / Studio'
        required: false
        default: 'Prism Ink'
        type: string
      app_description:
        description: 'Short Description'
        required: false
        default: 'Custom Nintendo Homebrew'
        type: string
      product_code:
        description: 'Unique Product Code for CIA (format: CTR-P-XXXX)'
        required: false
        default: 'CTR-P-MEEP'
        type: string
      unique_id:
        description: 'Unique Hex ID for CIA (e.g. 0xF4100)'
        required: false
        default: '0xF4100'
        type: string
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Homebrew Package
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: arm-none-eabi-gcc
      CXX: arm-none-eabi-g++
      LD: arm-none-eabi-gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools & Workspace
        run: |
          apt-get update && apt-get install -y unzip imagemagick zip curl || true
          mkdir -p workspace output_binaries

          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting archive: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d workspace
          else
            echo "No zip detected; copying repo files..."
            cp -r ./* workspace/ 2>/dev/null || true
          fi

      - name: Compile and Package Artifacts
        run: |
          set -e
          MAKE_DIR=$(find workspace -name "Makefile" -exec dirname {} \; | head -n 1)
          if [ -z "$MAKE_DIR" ]; then
            echo "Error: Could not locate a Makefile in the uploaded workspace!"
            exit 1
          fi
          cd "$MAKE_DIR"
          echo "Building in: $(pwd)"

          TARGET_FORMAT="${{ github.event.inputs.target_format || 'all' }}"
          TITLE="${{ github.event.inputs.app_title || 'Homebrew Game' }}"
          AUTHOR="${{ github.event.inputs.app_author || 'Prism Ink' }}"
          DESC="${{ github.event.inputs.app_description || 'Custom Nintendo Homebrew' }}"
          PROD_CODE="${{ github.event.inputs.product_code || 'CTR-P-MEEP' }}"
          UNIQUE_ID="${{ github.event.inputs.unique_id || '0xF4100' }}"

          make clean || true

          if [ ! -f "icon.png" ]; then
            convert -size 48x48 xc:#34495E icon.png || touch icon.png
          fi

          make CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ LD=arm-none-eabi-gcc

          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          TARGET_BASE="${ELF_FILE%.elf}"
          if [ -z "$TARGET_BASE" ]; then
            TARGET_BASE="homebrew_app"
          fi

          # 1. NDS Build
          if [ "$TARGET_FORMAT" = "nds" ] || [ "$TARGET_FORMAT" = "all" ]; then
            if ls *.nds 1> /dev/null 2>&1; then
              cp *.nds ../../output_binaries/
            elif [ -n "$ELF_FILE" ] && which ndstool >/dev/null 2>&1; then
              ndstool -c "${TARGET_BASE}.nds" -9 "$ELF_FILE"
              cp "${TARGET_BASE}.nds" ../../output_binaries/
            fi
          fi

          # 2. 3DSX Build
          if [ "$TARGET_FORMAT" = "3dsx" ] || [ "$TARGET_FORMAT" = "cia" ] || [ "$TARGET_FORMAT" = "all" ]; then
            smdhtool --create "$TITLE" "$DESC" "$AUTHOR" icon.png game.smdh || true

            if ! ls *.3dsx 1> /dev/null 2>&1; then
              if [ -n "$ELF_FILE" ]; then
                if [ -d "romfs" ]; then
                  3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh --romfs=romfs
                else
                  3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh
                fi
              fi
            fi

            if ls *.3dsx 1> /dev/null 2>&1; then
              cp *.3dsx ../../output_binaries/
            fi
          fi

          # 3. CIA Build
          if [ "$TARGET_FORMAT" = "cia" ] || [ "$TARGET_FORMAT" = "all" ]; then
            if [ -n "$ELF_FILE" ] && which makerom >/dev/null 2>&1; then
              printf "BasicInfo:\n  Title                   : \"%s\"\n  CompanyCode             : \"00\"\n  ProductCode             : \"%s\"\n  ContentType             : Application\n  Logo                    : Nintendo\n\nTitleInfo:\n  UniqueId                : %s\n  Category                : Application\n\nCardInfo:\n  MediaType               : Card1\n\nPlainRegion:\n\nOption:\n  UseOnSD                 : true\n  EnableCompress          : true\n  FreeProductCode         : true\n  EnableL2Cache           : true\n\nAccessControlInfo:\n  IdealProcessor          : 0\n  AffinityMask            : 1\n  Priority                : 16\n  CoreVersion             : 2\n  DescVersion             : 2\n  ReleaseKernelMajor      : \"02\"\n  ReleaseKernelMinor      : \"33\"\n  MemoryType              : Application\n  HandleTableSize         : 512\n  FileSystemAccess:\n    - DirectSdmc\n\nSystemControlInfo:\n  SaveDataSize            : 512KB\n  RemasterVersion         : 0\n  StackSize               : 0x40000\n" "$TITLE" "$PROD_CODE" "$UNIQUE_ID" > app.rsf

              BANNER_ARG=""
              if which bannertool >/dev/null 2>&1; then
                bannertool makebanner -i icon.png -a /dev/null -o banner.bin 2>/dev/null || true
                if [ -f "banner.bin" ]; then
                  BANNER_ARG="-banner banner.bin"
                fi
              fi

              ROMFS_ARG=""
              if [ -d "romfs" ]; then
                ROMFS_ARG="-romfs romfs"
              fi

              makerom -f cia -o "${TARGET_BASE}.cia" -elf "$ELF_FILE" -rsf app.rsf -icon game.smdh $BANNER_ARG $ROMFS_ARG || true
              
              if [ -f "${TARGET_BASE}.cia" ]; then
                cp "${TARGET_BASE}.cia" ../../output_binaries/
              fi
            fi
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_format || 'homebrew_binaries' }}
          path: output_binaries/*
