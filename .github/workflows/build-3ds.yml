name: Universal 3DS Game Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: arm-none-eabi-gcc
      CXX: arm-none-eabi-g++
      LD: arm-none-eabi-gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          which arm-none-eabi-gcc
          apt-get update && apt-get install -y unzip imagemagick || true
          mkdir -p workspace
          
          # Find any uploaded zip file
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unpacking $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d workspace
          else
            echo "No zip file found; copying repository root..."
            cp -r ./* workspace/ 2>/dev/null || true
          fi

      - name: Universal 3DS Compile & Package
        run: |
          # Locate the directory containing the Makefile
          MAKE_DIR=$(find workspace -name "Makefile" -exec dirname {} \; | head -n 1)
          if [ -z "$MAKE_DIR" ]; then
            echo "Error: Could not locate a Makefile in the uploaded project!"
            exit 1
          fi
          cd "$MAKE_DIR"
          echo "Building in: $(pwd)"

          # 1. Clean old objects
          make clean || true

          # 2. Ensure an icon exists for 3DS Home Menu
          if [ ! -f "icon.png" ]; then
            echo "Generating default 48x48 icon..."
            convert -size 48x48 xc:#4A90E2 icon.png || touch icon.png
          fi

          # 3. Create SMDH metadata descriptor
          smdhtool --create "Homebrew Game" "Custom 3DS Adventure" "Prism Ink" icon.png game.smdh || true

          # 4. Compile with 3DS ARM cross-compiler explicitly
          make CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ LD=arm-none-eabi-gcc

          # 5. If Makefile didn't generate .3dsx directly, package it from the compiled ELF
          if ! ls *.3dsx 1> /dev/null 2>&1; then
            ELF_FILE=$(ls *.elf | head -n 1)
            if [ -n "$ELF_FILE" ]; then
              TARGET_NAME="${ELF_FILE%.elf}"
              echo "Packaging $TARGET_NAME.3dsx..."
              if [ -d "romfs" ]; then
                3dsxtool "$ELF_FILE" "$TARGET_NAME.3dsx" --smdh=game.smdh --romfs=romfs
              else
                3dsxtool "$ELF_FILE" "$TARGET_NAME.3dsx" --smdh=game.smdh
              fi
            fi
          fi

          echo "Build Complete! Output files:"
          ls -lh *.3dsx

      - name: Upload 3DS Executable
        uses: actions/upload-artifact@v4
        with:
          name: compiled_3ds_game
          path: "**/*.3dsx"
