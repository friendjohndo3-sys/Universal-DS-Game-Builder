name: Universal 3DS Game Builder
on:
  workflow_dispatch:
    inputs:
      target_format:
        description: 'Choose build output format'
        required: true
        default: 'cia'
        type: choice
        options:
          - 'cia'
          - '3dsx'
          - 'all'
          - 'nds'
      app_title:
        description: 'Application Title'
        required: false
        default: 'Monster Truck Mayhem!'
        type: string
      app_author:
        description: 'Author / Studio'
        required: false
        default: 'Prism Ink'
        type: string
      app_description:
        description: 'Short Description'
        required: false
        default: '3D Stadium Racing & Freestyle'
        type: string
      product_code:
        description: 'Unique Product Code for CIA (format: CTR-P-XXXX)'
        required: false
        default: 'CTR-P-MEEP'
        type: string
      unique_id:
        description: 'Unique Hex ID for CIA (e.g. 0xF4100)'
        required: false
        default: '0xF4100'
        type: string
  push:
    branches:
      - main
      - master
jobs:
  build:
    name: Build Homebrew Package
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      CC: arm-none-eabi-gcc
      CXX: arm-none-eabi-g++
      LD: arm-none-eabi-gcc
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools & Install CIA Tools
        run: |
          apt-get update && apt-get install -y unzip imagemagick zip curl wget python3 || true
          mkdir -p "$GITHUB_WORKSPACE/workspace" "$GITHUB_WORKSPACE/output_binaries"

          curl -sSL "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip" -o /tmp/makerom.zip || true
          if [ -f /tmp/makerom.zip ]; then
            unzip -o /tmp/makerom.zip -d /tmp/makerom_bin 2>/dev/null || true
            find /tmp/makerom_bin -type f -name "makerom" -exec cp {} /usr/local/bin/makerom \; 2>/dev/null || true
            chmod +x /usr/local/bin/makerom 2>/dev/null || true
          fi

          curl -sSL "https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip" -o /tmp/bannertool.zip || true
          if unzip -t /tmp/bannertool.zip >/dev/null 2>&1; then
            unzip -o /tmp/bannertool.zip -d /tmp/bannertool_bin 2>/dev/null || true
            find /tmp/bannertool_bin -type f -name "bannertool" -exec cp {} /usr/local/bin/bannertool \; 2>/dev/null || true
            chmod +x /usr/local/bin/bannertool 2>/dev/null || true
          fi

          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/workspace"
          else
            cp -r ./* "$GITHUB_WORKSPACE/workspace/" 2>/dev/null || true
          fi

      - name: Compile and Package Artifacts
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/output_binaries"

          MAKE_DIR=$(find "$GITHUB_WORKSPACE/workspace" -name "Makefile" -exec dirname {} \; | head -n 1)
          if [ -z "$MAKE_DIR" ]; then
            echo "Error: No Makefile found!"
            exit 1
          fi
          cd "$MAKE_DIR"

          TARGET_FORMAT="${{ github.event.inputs.target_format || 'cia' }}"
          TITLE="${{ github.event.inputs.app_title || 'Monster Truck Mayhem!' }}"
          AUTHOR="${{ github.event.inputs.app_author || 'Prism Ink' }}"
          DESC="${{ github.event.inputs.app_description || '3D Stadium Racing & Freestyle' }}"
          PROD_CODE="${{ github.event.inputs.product_code || 'CTR-P-MEEP' }}"
          UNIQUE_ID="${{ github.event.inputs.unique_id || '0xF4100' }}"

          make clean || true

          if [ ! -f "icon.png" ]; then
            convert -size 48x48 xc:#34495E icon.png || touch icon.png
          fi

          smdhtool --create "$TITLE" "$DESC" "$AUTHOR" icon.png game.smdh || true
          make CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ LD=arm-none-eabi-gcc

          ELF_FILE=$(ls *.elf 2>/dev/null | head -n 1)
          TARGET_BASE="${ELF_FILE%.elf}"
          if [ -z "$TARGET_BASE" ]; then
            TARGET_BASE="homebrew_app"
          fi

          if [ -d "romfs" ]; then
            3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh --romfs=romfs || true
          else
            3dsxtool "$ELF_FILE" "${TARGET_BASE}.3dsx" --smdh=game.smdh || true
          fi

          if [ "$TARGET_FORMAT" = "cia" ] || [ "$TARGET_FORMAT" = "all" ]; then
            if which makerom >/dev/null 2>&1 && [ -n "$ELF_FILE" ]; then
              
              echo "BasicInfo:" > app.rsf
              echo "  Title                   : \"$TITLE\"" >> app.rsf
              echo "  CompanyCode             : \"00\"" >> app.rsf
              echo "  ProductCode             : \"$PROD_CODE\"" >> app.rsf
              echo "  ContentType             : Application" >> app.rsf
              echo "  Logo                    : Nintendo" >> app.rsf
              echo "TitleInfo:" >> app.rsf
              echo "  UniqueId                : $UNIQUE_ID" >> app.rsf
              echo "  Category                : Application" >> app.rsf
              echo "CardInfo:" >> app.rsf
              echo "  MediaType               : Card1" >> app.rsf
              echo "Option:" >> app.rsf
              echo "  UseOnSD                 : true" >> app.rsf
              echo "  FreeProductCode         : true" >> app.rsf
              echo "AccessControlInfo:" >> app.rsf
              echo "  IdealProcessor          : 0" >> app.rsf
              echo "  AffinityMask            : 1" >> app.rsf
              echo "  Priority                : 16" >> app.rsf
              echo "  CoreVersion             : 2" >> app.rsf
              echo "  DescVersion             : 2" >> app.rsf
              echo "  ReleaseKernelMajor      : \"02\"" >> app.rsf
              echo "  ReleaseKernelMinor      : \"33\"" >> app.rsf
              echo "  MemoryType              : Application" >> app.rsf
              echo "  HandleTableSize         : 512" >> app.rsf
              echo "  FileSystemAccess:" >> app.rsf
              echo "    - DirectSdmc" >> app.rsf
              echo "  SystemCallAccess:" >> app.rsf
              echo "    Arbitrary: true" >> app.rsf
              echo "  ServiceAccessControl:" >> app.rsf
              echo "    - \$ALL" >> app.rsf
              echo "SystemControlInfo:" >> app.rsf
              echo "  SaveDataSize            : 512KB" >> app.rsf
              echo "  RemasterVersion         : 0" >> app.rsf
              echo "  StackSize               : 0x40000" >> app.rsf

              echo "import struct, os, sys" > extract_romfs.py
              echo "try:" >> extract_romfs.py
              echo "    with open(sys.argv[1], 'rb') as f: data = f.read()" >> extract_romfs.py
              echo "    if data[:4] == b'3DSX' and len(data) >= 48:" >> extract_romfs.py
              echo "        o, s = struct.unpack_from('<II', data, 40)" >> extract_romfs.py
              echo "        if o > 0 and s > 0:" >> extract_romfs.py
              echo "            with open('romfs.bin', 'wb') as out: out.write(data[o:o+s])" >> extract_romfs.py
              echo "except:" >> extract_romfs.py
              echo "    pass" >> extract_romfs.py
              
              python3 extract_romfs.py "${TARGET_BASE}.3dsx"
              
              ROMFS_ARG=""
              if [ -f "romfs.bin" ]; then
                ROMFS_ARG="-romfs romfs.bin"
              fi
              
              BANNER_ARG=""
              if which bannertool >/dev/null 2>&1; then
                bannertool makebanner -i icon.png -a /dev/null -o banner.bin 2>/dev/null || true
                if [ -f "banner.bin" ]; then
                  BANNER_ARG="-banner banner.bin"
                fi
              fi

              makerom -f cia -o "${TARGET_BASE}.cia" -elf "$ELF_FILE" -rsf app.rsf -icon game.smdh $BANNER_ARG $ROMFS_ARG
              
              if [ -f "${TARGET_BASE}.cia" ]; then
                cp "${TARGET_BASE}.cia" "$OUT_DIR/"
              fi
            fi
          fi

          if [ "$TARGET_FORMAT" = "3dsx" ] || [ "$TARGET_FORMAT" = "all" ]; then
            if ls *.3dsx 1> /dev/null 2>&1; then
              cp *.3dsx "$OUT_DIR/"
            fi
          fi

          if [ "$TARGET_FORMAT" = "nds" ] || [ "$TARGET_FORMAT" = "all" ]; then
            if ls *.nds 1> /dev/null 2>&1; then
              cp *.nds "$OUT_DIR/"
            fi
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_format || 'homebrew_binaries' }}
          path: output_binaries/*
