name: Build 3DS Game from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Unzip & Extract Project
        run: |
          apt-get update && apt-get install -y unzip
          mkdir -p project
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Compile 3DS Executable
        run: |
          TARGET_DIR=$(find project -name "Makefile" -exec dirname {} \;)
          cd "$TARGET_DIR"

          # Clean and compile ELF binary
          make clean
          make meepa_game.elf

          # Package 3DSX directly with romfs
          3dsxtool meepa_game.elf meepa_game.3dsx --romfs=romfs

          echo "Successfully created meepa_game.3dsx!"
          ls -la meepa_game.3dsx

      - name: Upload 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: meepa_game_3dsx
          path: "**/*.3dsx"
