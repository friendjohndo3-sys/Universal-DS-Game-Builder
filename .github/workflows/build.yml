name: Build 3DS Game from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o meepa_3ds_game_ready.zip -d project
          ls -la project

      - name: Compile 3DS Executable
        working-directory: project
        run: |
          make clean
          make

      - name: Upload 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: meepa_game_3dsx
          path: project/*.3dsx
          
