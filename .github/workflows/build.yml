name: Build 3DS Game from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Unzip & Extract Project
        run: |
          apt-get update && apt-get install -y unzip
          mkdir -p project
          # Find any .zip file in the root and extract it
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project
          ls -la project

      - name: Compile 3DS Executable
        run: |
          # If the zip extracted into a subfolder, enter it
          if [ -d "project/meepa_3ds_game_fixed" ]; then
            cd project/meepa_3ds_game_fixed
          else
            cd project
          fi
          make clean
          make

      - name: Upload 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: meepa_game_3dsx
          path: "**/*.3dsx"
